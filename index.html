
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KiHeb · Kitap Takip</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/style.css">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --accent: #06b6d4;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --radius: 12px;
      --radius-lg: 16px;
      --shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 10px 28px rgba(15, 23, 42, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    /* Animasyonlar */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes scaleIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      box-shadow: var(--shadow);
      animation: slideDown 0.4s ease-out;
    }

    /* Clean, responsive header layout */
    .header-content { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: nowrap; }
    .header-title { display:flex; flex-direction:column; gap:2px; min-width: 0; }
    .header-title h1 { font-size: 18px; margin:0; }
    .search-wrapper { flex: 1 1 auto; min-width: 0; margin: 0 12px; }
    .search-wrapper .search-bar { display:flex; align-items:center; gap:8px; }
    .search-wrapper .search-bar input { flex:1; min-width:0; }
    .header-actions { display:flex; gap:8px; align-items:center; }
    .header-actions .btn { padding: 8px 10px; border-radius: 10px; }

    /* When modal is open, hide header and mobile nav to reduce clutter */
    body.modal-open header { display: none !important; }
    body.modal-open #mobileBottomNav { display: none !important; }
    
    .header-title h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      margin: 0;
      transition: transform 0.3s ease;
    }

    .header-title h1:hover {
      transform: scale(1.05);
    }

    .header-title p { font-size: 12px; color: var(--text-muted); margin: 4px 0 0 0; }
    .search-wrapper { position: relative; flex: 1; /* max-width: 400px; */ min-width: 200px; }
    .search-bar { display: flex; gap: 8px; }
    
    .search-bar input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(15,23,42,0.06);
    }

    .search-bar input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      transform: translateY(-2px);
    }

    .header-actions { display: flex; gap: 8px; }

    /* Slightly larger header buttons and spacing for polish */
    .header-actions .btn { padding: 10px; border-radius: 10px; }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    button:active::before {
      width: 300px;
      height: 300px;
    }

    .btn {
      padding: 8px 12px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transform: translateY(0);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:active { background: var(--primary-dark); }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-icon { width: 40px; height: 40px; padding: 0; justify-content: center; border-radius: 50%; }

    .auth-section {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      animation: fadeIn 0.5s ease-out;
    }

    .auth-card {
      background: var(--card);
      padding: 32px 24px;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      animation: scaleIn 0.5s ease-out;
    }

    .auth-card h2 { font-size: 28px; font-weight: 700; text-align: center; color: var(--primary); margin-bottom: 8px; }
    .auth-card p { text-align: center; color: var(--text-muted); margin-bottom: 20px; }
    .auth-buttons { display: flex; flex-direction: column; gap: 12px; }
    
    .form-input {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      background: var(--card);
      color: var(--text);
      width: 100%;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    #app-section { display: none; flex-direction: column; min-height: 100vh; }
    #app-section.active {
      animation: fadeIn 0.4s ease-out;
    }
    #app-section > main { flex: 1; }

    main { /* max-width: 1200px; */ margin: 0 5vw; padding: 16px; }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card);
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      text-align: center;
      animation: fadeIn 0.5s ease-out backwards;
      transition: all 0.3s ease;
    }

    .stat-card:nth-child(1) { animation-delay: 0.1s; }
    .stat-card:nth-child(2) { animation-delay: 0.2s; }
    .stat-card:nth-child(3) { animation-delay: 0.3s; }
    .stat-card:nth-child(4) { animation-delay: 0.4s; }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }

    .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      transition: transform 0.3s ease;
    }

    .stat-card:hover .stat-value {
      transform: scale(1.2);
    }

    .controls {
      background: var(--card);
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.6s ease-out 0.5s backwards;
    }

    @media (min-width: 768px) { .controls { flex-direction: row; align-items: center; justify-content: space-between; } }
    .controls-group { display: flex; flex-direction: column; gap: 8px; }
    @media (min-width: 768px) { .controls-group { flex-direction: row; align-items: center; gap: 10px; } }
    
    .controls select, .controls input[type="date"] {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      min-width: 120px;
      transition: all 0.3s ease;
    }

    .controls select:focus, .controls input[type="date"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    /* Wide view: show responsive card grid instead of single full-width rows */
    .books-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; margin-bottom: 100px; align-items: stretch;}
    .books-list.compact { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    
    .book-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: row;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
      animation: fadeIn 0.5s ease-out backwards;
      opacity: 0;
    }

    .book-card.animate {
      opacity: 1;
    }

    .book-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }

    .book-card.compact { flex-direction: column; }
    
    .book-cover {
      width: 120px;
      aspect-ratio: 2 / 3; /* book-like proportion */
      height: auto;
      flex-shrink: 0;
      object-fit: cover;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transition: transform 0.3s ease;
      border-radius: 6px;
    }

    .book-card:hover .book-cover {
      transform: scale(1.05);
    }

    .book-card.compact .book-cover { width: 100%; aspect-ratio: 2 / 3; height: auto; border-radius: 8px; }
    .book-info { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; justify-content: space-between; max-width: 900px; }
    .book-title { font-size: 14px; font-weight: 600; line-height: 1.3; }
    .book-meta { font-size: 12px; color: var(--text-muted); }
    
    .book-progress {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin: 4px 0;
    }

    .book-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 1.2s ease;
      animation: shimmer 20s infinite;
      background-size: 200% 100%;
    }

    .book-stats { font-size: 11px; color: var(--text-muted); }
    .book-location { font-size: 11px; color: var(--text-muted); padding: 6px; background: var(--bg); border-radius: 6px; }
    .book-actions { display: flex; gap: 6px; padding: 8px; background: var(--bg); border-top: 1px solid var(--border); margin: 8px -12px -12px -12px; }
    .book-actions button { flex: 1; padding: 6px 8px; font-size: 12px; }

    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-lg);
      z-index: 40;
      animation: bounce 2s infinite;
      transition: all 0.3s ease;
    }

    .fab:hover {
      animation: none;
      transform: scale(1.1) rotate(90deg);
    }

    @media (min-width: 768px) { .fab { display: none; } }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 50;
      align-items: flex-end;
      padding: 0;
      overflow-y: auto;
      backdrop-filter: blur(4px);
      animation: fadeIn 0.3s ease-out;
    }

    .modal.active { display: flex; }
    
    .modal-content {
      background: var(--card);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      width: 100%;
      animation: slideUp 0.3s ease;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Two-pane modal tweaks for add/edit 2.0 - make full-screen on all devices */
    .modal.active { display: flex; }
    .modal-content.two-pane { box-sizing: border-box; width: 100%; height: 100vh; max-width: none; max-height: none; margin: 0; border-radius: 0; display: flex; flex-direction: column; }
    .modal-content.two-pane .left-pane { flex: 1 1 auto; overflow:auto; }
    .modal-content.two-pane .right-pane { border-left: 1px solid var(--border); padding-left: 12px; overflow:auto; }
    @media(min-width:880px) {
      .modal-content.two-pane .left-pane { width: 60%; }
      .modal-content.two-pane .right-pane { width: 40%; display: block; }
    }

    /* Right-pane preview mode: when a site is selected, expand iframe to fill the pane */
    .modal-content.two-pane .right-pane.preview-active #modal-search-controls { display: none !important; }
    .modal-content.two-pane .right-pane.preview-active #modal-search-results { display: none !important; }
    .modal-content.two-pane .right-pane.preview-active #modal-search-webview-wrapper { display: flex !important; height: 100% !important; margin-top: 0 !important; }
    .modal-content.two-pane .right-pane.preview-active #modal-search-webview { height: 100% !important; }
    .modal-content.two-pane .right-pane.preview-active #modal-webview-closepane { display: block !important; }

    /* Mobile-specific: stack panes and provide fullscreen preview overlay */
    @media(max-width:880px) {
      .modal-content.two-pane { padding: 12px; display:flex; flex-direction:column; }
      .modal-content.two-pane .left-pane { width: 100%; }
      .modal-content.two-pane .right-pane { position: fixed; inset: 0 0 0 0; width: 100%; height: 100%; background: var(--card); z-index: 1300; transform: translateY(100%); transition: transform 240ms ease; display:flex; flex-direction:column; padding: 12px; box-shadow: var(--shadow-lg); }
      .modal-content.two-pane.mobile-preview-active .right-pane { transform: translateY(0); }
      .modal-content.two-pane.mobile-preview-active .left-pane { display: none; }
      .modal-content.two-pane .right-pane #modal-search-webview { height: 100% !important; }
      .modal-content.two-pane .right-pane #modal-webview-closepane { display: block !important; position: absolute; top: 12px; right: 12px; z-index: 1400; }
    }

    @media (min-width: 768px) {
      .modal { align-items: center; justify-content: center; }
      .modal-content { border-radius: var(--radius-lg); width: 100%; max-width: 500px; animation: scaleIn 0.3s ease; }
    }

    .modal-header { font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    
    .modal-close {
      background: none;
      font-size: 24px;
      color: var(--text-muted);
      padding: 0;
      width: 32px;
      height: 32px;
      transition: all 0.3s ease;
    }

    .modal-close:hover {
      transform: rotate(90deg);
      color: var(--danger);
    }

    .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) { .form-grid { grid-template-columns: repeat(2, 1fr); } }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 13px; font-weight: 500; }
    
    .form-group input, .form-group textarea, .form-group select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s ease;
      /* use page background for inputs so they don't look bright white */
      background: var(--bg);
      color: var(--text);
    }

    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      transform: translateY(-2px);
    }

    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-actions { display: flex; gap: 8px; justify-content: flex-end; grid-column: 1 / -1; margin-top: 12px; }

    .search-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius) var(--radius);
      max-height: 400px;
      overflow-y: auto;
      z-index: 99;
      display: none;
      box-shadow: var(--shadow-lg);
      animation: slideDown 0.3s ease-out;
    }

    /* Özel Scrollbar Stilleri */
    .search-results::-webkit-scrollbar {
      width: 8px;
    }

    .search-results::-webkit-scrollbar-track {
      background: var(--bg);
      border-radius: 0 0 var(--radius) 0;
    }

    .search-results::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
      transition: background 0.3s ease;
    }

    .search-results::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    /* Firefox Scrollbar */
    .search-results {
      scrollbar-width: thin;
      scrollbar-color: var(--border) var(--bg);
    }

    .search-results.show {
      display: block;
    }

    /* Accordion for extra fields inside modal */
    .accordion { border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 6px; }
    .acc-toggle { display:flex; align-items:center; gap:8px; background:transparent; border:none; width:100%; text-align:left; padding:8px 0; font-weight:600; color:var(--primary); cursor:pointer; }
    .acc-toggle .chev { transition: transform 0.25s ease; }
    .acc-content { display:none; padding-top:8px; }
    .acc-content.show { display:block; }

    /* Skeleton shimmer used by overlay and small placeholders */
    @keyframes shimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }
    .skeleton { background: linear-gradient(90deg,#eee,#f5f5f5); background-size:200% 100%; animation: shimmer 1.2s linear infinite; }

    /* Ensure modal important area sticks to top for readability */
    .modal-important { position: sticky; top: 0; background: transparent; z-index: 99; padding:8px }

    /* Libraries / Shelves visuals */
    /* Libraries / Shelves visuals (warm wood palette) */
    .library-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 22px rgba(15,23,42,0.06);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      overflow: visible;
      min-height: 140px;
      overflow: auto;
    }

    .library-card:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(15,23,42,0.08); }

    .library-card .lib-header { display:flex;align-items:center;justify-content:space-between;gap:8px }

    /* shelf: dark blue theme to match site */
    .shelf-card { border: 1px solid var(--border); background: linear-gradient(180deg,#1e293b,#0f172a); border-radius:8px; padding:8px; color:#ffffff }

    /* Fixed-height shelf so adding/removing spines doesn't change layout height */
    .shelf-drop { 
      background: #0f172a; 
      border-radius:6px; 
      border:1px solid rgba(255,255,255,0.06); 
      display:flex;
      gap:6px; 
      padding:8px; 
      overflow-x:auto; 
      overflow-y:hidden;
      min-height: 150px; /* keep shelf height stable even when empty */
      align-items: center;
    }

    .book-spine { width: 100px; height: 150px; border-radius:4px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); cursor:default; display:inline-flex; align-items:center; justify-content:center; overflow:hidden; border:1px solid rgba(0,0,0,0.06); margin-right:6px; flex: 0 0 auto; scroll-snap-align: start; }
    .book-spine img.shelf-cover { width:100%; height:100%; object-fit:cover; display:block }
    .book-spine .shelf-title { padding:6px; font-size:11px; text-align:center; color:var(--text); background:transparent; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }

    /* small grab area inside book spine used to move the book; rest of spine can be used to pan the shelf */
    .spine-grab {
      position: absolute;
      right: 6px;
      top: 6px;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor:grab;
      z-index: 5;
      user-select: none;
    }

    .book-spine { position: relative; }

     /* Prevent text selection inside book spines (except the grab handle),
       and keep UI tidy when pressing book areas. */
     .book-spine, .book-spine * { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }

    .book-spine.dragging { opacity: 0.7; cursor:grabbing; transform: scale(1.02); }

    .drag-source-placeholder { display:inline-block; background: transparent; border-radius:4px; margin-right:6px; }
    .book-insert-placeholder { width:12px; height:120px; display:inline-block; background: rgba(255,255,255,0.04); border-radius:4px; margin-right:6px; }
    .shelf-card.insert-before, .shelf-card.insert-after { outline: 2px dashed rgba(255,255,255,0.06); }
    .library-card.insert-before, .library-card.insert-after { outline: 2px dashed rgba(255,255,255,0.06); }

    /* Visible insertion bar used when reordering libraries */
    .lib-insert-bar {
      display: block;
      height: 10px;
      border-radius: 6px;
      margin: 6px 0;
      background: linear-gradient(90deg, rgba(255,215,64,0.95), rgba(255,149,0,0.95));
      box-shadow: 0 6px 18px rgba(255,145,0,0.12), inset 0 0 0 2px rgba(255,255,255,0.06);

    .search-result-item {

      // perform a query across the selected providers
      async function performAdvancedSearch(opts) {
        const results = [];
        const provider = opts && opts.provider ? opts.provider : 'all';
        const providers = (provider === 'all') ? ['google', 'openlibrary', 'gutendex', 'loc'] : [provider];
        const promises = providers.map(p => {
          if (p === 'google') return (typeof searchGoogleBooksProvider === 'function' ? searchGoogleBooksProvider(opts) : Promise.resolve([]));
          if (p === 'openlibrary') return (typeof searchOpenLibrary === 'function' ? searchOpenLibrary(opts) : Promise.resolve([]));
          if (p === 'gutendex') return (typeof searchGutendex === 'function' ? searchGutendex(opts) : Promise.resolve([]));
          if (p === 'loc') return (typeof searchLibraryOfCongress === 'function' ? searchLibraryOfCongress(opts) : Promise.resolve([]));
          // milli provider removed
          return Promise.resolve([]);
        });
        const settled = await Promise.allSettled(promises);
        settled.forEach(s => { if (s.status === 'fulfilled' && Array.isArray(s.value)) results.push(...s.value); });

        // include local matches if requested
        if (opts && opts.includeLocal) {
          try { const local = searchLocalBooks(opts.q || opts.title || ''); results.push(...local.map(r => ({ title: r.title, authors: [r.author], publisher: r.publisher, cover: r.cover, source: 'local', key: r.key }))); } catch (e) {}
        }

        // dedupe by title + first author
        const seen = new Map();
        const merged = [];
        results.forEach(r => {
          const t = (r.title || '').toString().toLowerCase().trim();
          const a = Array.isArray(r.authors) ? (r.authors[0] || '') : (Array.isArray(r.author) ? (r.author[0]||'') : (r.author || ''));
          const key = (t + '|' + (a || '')).replace(/\s+/g, ' ');
          if (!seen.has(key)) { seen.set(key, true); merged.push(r); }
        });
        return merged;
      }

      // OpenLibrary provider
      async function searchOpenLibrary(query) {
        const opts = { limit: 10 };
        if (!query) return [];
        if (typeof query === 'string') opts.q = query.trim();
        else Object.assign(opts, query);

        try {
          const params = new URLSearchParams();
          if (opts.title) params.append('title', opts.title);
          if (opts.author) params.append('author', opts.author);
          if (opts.publisher) params.append('publisher', opts.publisher);
          if (opts.q) params.append('q', opts.q);
          params.append('limit', String(opts.limit || 10));
          const res = await fetch(`https://openlibrary.org/search.json?${params.toString()}`);
          const data = await res.json();
          if (!data.docs || !Array.isArray(data.docs)) return [];
          return data.docs.map(d => ({
            title: d.title || '',
            authors: d.author_name || [],
            publisher: (d.publisher && d.publisher[0]) || '',
            publishedDate: d.first_publish_year || '',
            pageCount: d.number_of_pages_median || '',
            cover: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : '',
            source: 'openlibrary',
            raw: d
          }));
        } catch (e) {
          console.error('searchOpenLibrary', e);
          return [];
        }
      }

      // Google Books provider (returns normalized array for merging)
      async function searchGoogleBooksProvider(query) {
        const opts = { limit: 10 };
        if (!query) return [];
        if (typeof query === 'string') opts.q = query.trim();
        else Object.assign(opts, query);

        try {
          const parts = [];
          if (opts.title) parts.push('intitle:' + opts.title);
          if (opts.author) parts.push('inauthor:' + opts.author);
          if (opts.publisher) parts.push('inpublisher:' + opts.publisher);
          if (opts.q) parts.push(opts.q);
          const q = parts.join(' ') || '';
          const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=${opts.limit || 10}`);
          const data = await response.json();
          if (!data.items || !Array.isArray(data.items)) return [];
          return data.items.map(item => {
            const info = item.volumeInfo || {};
            return {
              title: info.title || '',
              authors: info.authors || [],
              publisher: info.publisher || '',
              publishedDate: info.publishedDate || '',
              pageCount: info.pageCount || '',
              cover: info.imageLinks?.thumbnail || '',
              source: 'google',
              raw: item
            };
          });
        } catch (err) {
          console.error('searchGoogleBooksProvider', err);
          return [];
        }
      }

      // Gutendex (Project Gutenberg) provider
      async function searchGutendex(query) {
        const opts = { limit: 10 };
        if (!query) return [];
        if (typeof query === 'string') opts.q = query.trim();
        else Object.assign(opts, query);
        try {
          const q = opts.q || opts.title || '';
          const url = `https://gutendex.com/books?search=${encodeURIComponent(q)}&page=1`;
          const res = await fetch(url);
          const data = await res.json();
          if (!data.results || !Array.isArray(data.results)) return [];
          return data.results.slice(0, opts.limit || 10).map(b => ({
            title: b.title || '',
            authors: (b.authors || []).map(a => a.name).filter(Boolean),
            publisher: '',
            publishedDate: b.created || '',
            pageCount: b.pagination || '',
            cover: (b.formats && (b.formats['image/jpeg'] || b.formats['image/png'])) || '',
            source: 'gutendex',
            raw: b
          }));
        } catch (e) {
          console.error('searchGutendex', e);
          return [];
        }
      }

      // Library of Congress provider

        const opts = { limit: 10 };

          const res = await fetch(url);
          const data = await res.json();
          if (!data.results || !Array.isArray(data.results)) return [];
          return data.results.slice(0, opts.limit || 10).map(r => ({
            title: r.title || '',
            authors: r.creator ? (Array.isArray(r.creator) ? r.creator : [r.creator]) : [],
            publisher: r.publisher || '',
            publishedDate: r.date || '',
            pageCount: '',
            cover: r.image_url || '',

    async function loadBooks() {
      if (!currentUser) return;
      // if user is actively dragging, defer updating local books to avoid re-renders/flicker
      if (window.__dragActive) { window.__pendingRefresh = true; return; }
      try {
        const snapshot = await db.ref(`users/${currentUser.uid}/books`).once('value');
        books = snapshot.val() || {};
        // Normalize bookshelf/shelf fields: if a book stores bookshelf/shelf as names,
        // find or create the corresponding library and shelf and update the book to store their IDs.
        try {
          const libsSnap = await db.ref(`users/${currentUser.uid}/libs`).once('value');
          const libs = libsSnap.val() || {};
          const libsByName = {};
          Object.entries(libs).forEach(([id, l]) => { if (l && l.name) libsByName[l.name] = id; });

          for (const [bk, b] of Object.entries(books || {})) {
            if (!b) continue;
            let updated = {};
            // handle bookshelf (may be name or id)
            if (b.bookshelf) {
              // If bookshelf already matches an existing id, keep it
              if (!libs[b.bookshelf]) {
                // maybe it's a name
                const foundId = libsByName[b.bookshelf];
                if (foundId) {
                  updated.bookshelf = foundId;
                } else {
                  // create new library with this name
                  const nlRef = db.ref(`users/${currentUser.uid}/libs`).push();
                  await nlRef.set({ name: b.bookshelf, shelves: {} });
                  updated.bookshelf = nlRef.key;
                  // add to local maps to speed up subsequent matches
                  libs[updated.bookshelf] = { name: b.bookshelf, shelves: {} };
                  libsByName[b.bookshelf] = updated.bookshelf;
                }
              }
            }

            // handle shelf (only meaningful if we have a bookshelf id)
            if (b.shelf) {
              let targetLibId = updated.bookshelf || (b.bookshelf && libs[b.bookshelf] ? b.bookshelf : null);
              // if bookshelf was previously a name that matched, targetLibId may be set
              if (!targetLibId && b.bookshelf && libsByName[b.bookshelf]) targetLibId = libsByName[b.bookshelf];
              if (targetLibId) {
                const shelves = (libs[targetLibId] && libs[targetLibId].shelves) || {};
                // if shelf is an id already present
                if (shelves[b.shelf]) {
                  updated.shelf = b.shelf;
                } else {
                  // try find shelf by name
                  const foundShelf = Object.keys(shelves).find(sid => shelves[sid] && shelves[sid].name === b.shelf);
                  if (foundShelf) {
                    updated.shelf = foundShelf;
                  } else {
                    // create shelf under targetLibId
                    const nsRef = db.ref(`users/${currentUser.uid}/libs/${targetLibId}/shelves`).push();
                    await nsRef.set({ name: b.shelf });
                    updated.shelf = nsRef.key;
                    // update local libs structure
                    libs[targetLibId] = libs[targetLibId] || {};
                    libs[targetLibId].shelves = libs[targetLibId].shelves || {};
                    libs[targetLibId].shelves[updated.shelf] = { name: b.shelf };
                  }
                }
              }
            }

            // if we have any updates, apply them to DB and update local books map
            if (Object.keys(updated).length > 0) {
              await db.ref(`users/${currentUser.uid}/books/${bk}`).update(updated);
              books[bk] = { ...b, ...updated };
            }
          }

          // reload libraries so UI reflects newly created libs/shelves
          await loadLibraries();
        } catch (err) {
          console.warn('Normalization failed', err);
        }
        renderBooks();
        updateStats();
      } catch (err) {
        console.error('Kitaplar yüklenemedi:', err);
        hideSkeleton();
      }
    }

    // --- Libraries / Shelves management ---
    async function loadLibraries() {
      if (!currentUser) return;
      // if dragging, defer library reload to avoid visual churn
      if (window.__dragActive) { window.__pendingRefresh = true; return; }
      try {
        const snap = await db.ref(`users/${currentUser.uid}/libs`).once('value');
        const libs = snap.val() || {};
        libraries = libs;
        renderLibraries(libs);
      } catch (err) {
        console.error('Kütüphaneler yüklenemedi', err);
      }
    }

    // ORDER helpers: compute order between two numbers; if gap too small, caller should reindex
    function computeOrderBetween(prev, next) {
      if (prev == null && next == null) return 1000;
      if (prev == null) return (next || 1000) - 1000;
      if (next == null) return (prev || 0) + 1000;
      const a = Number(prev) || 0;
      const b = Number(next) || (a + 2000);
      if (b - a > 1) return Math.floor((a + b) / 2);
      return null; // caller will need to reindex
    }

    // Drag state helpers: prevent heavy reloads while user is dragging
    function startDrag() {

        window.__dragActive = true;

      // Pointer-driven shelf horizontal panning: when user presses a book spine background
      // (NOT the `.spine-grab`) or the empty area of a `.shelf-drop`, allow click-drag to
      // horizontally scroll the shelf. This intentionally does NOT start a book drag.
      (function() {
        let panState = null;

        function beginShelfPan(ev, dropZone) {

            try { dropZone.setPointerCapture && dropZone.setPointerCapture(ev.pointerId); } catch (e) {}
            document.addEventListener('pointermove', moveShelfPan);
            document.addEventListener('pointerup', endShelfPan);
            document.addEventListener('pointercancel', cancelShelfPan);
            throttledLog('panstart', ['[panstart]', { dropZone: dropZone.dataset.shelf || dropZone.className, x: ev.clientX }], 200);
          } catch (err) { console.error('beginShelfPan', err); }
        }

        function moveShelfPan(ev) {
          try {
            if (!panState || (ev.pointerId && panState.pointerId !== ev.pointerId)) return;
            const dx = ev.clientX - panState.startX;
            panState.dropZone.scrollLeft = panState.startScroll - dx;
            throttledLog('panmove', ['[panmove]', { dx }], 160);
          } catch (err) { /* ignore */ }
        }

        function endShelfPan(ev) {
          try {
            if (!panState) return cleanup();
            throttledLog('panend', ['[panend]', { x: ev.clientX }], 200);
          } catch (err) { /* ignore */ } finally { cleanup(); }
        }

        function cancelShelfPan(ev) { try { cleanup(); } catch (e) {} }

        document.addEventListener('pointerdown', (ev) => {

            const spine = target.closest ? target.closest('.book-spine') : null;

      })();

            bookPtr.currentDrop = drop;

              const nextEl = bookPtr.insertPlaceholder.nextElementSibling && bookPtr.insertPlaceholder.nextElementSibling.classList.contains('book-spine') ? bookPtr.insertPlaceholder.nextElementSibling : null;
              const prev = prevEl ? prevEl.dataset.key : null; const next = nextEl ? nextEl.dataset.key : null;
              const prevOrder = prev && books[prev] ? Number(books[prev].order) : null; const nextOrder = next && books[next] ? Number(books[next].order) : null;

        if (!payload) { container.__insertCandidate = null; return; }
        const parsed = parseDragPayload(payload);
        if (!parsed || parsed.type !== 'lib') { container.__insertCandidate = null; Array.from(container.querySelectorAll('.library-card')).forEach(c => { c.classList.remove('insert-before'); c.classList.remove('insert-after'); }); return; }
        const srcLib = parsed.id;
        try {
          // compute insert position using stable children ordering
          const children = Array.from(container.querySelectorAll('.library-card'));
          let insertIndex = children.length;
          if (container.__insertCandidate && container.__insertCandidate.before) {
            insertIndex = children.indexOf(container.__insertCandidate.before);
            if (insertIndex === -1) insertIndex = children.length;
          }
          const prevEl = insertIndex > 0 ? children[insertIndex - 1] : null;
          const nextEl = insertIndex < children.length ? children[insertIndex] : null;
          const prevId = prevEl ? prevEl.dataset.lib : null;
          const nextId = nextEl ? nextEl.dataset.lib : null;
          const prevOrder = prevId && libs[prevId] ? Number(libs[prevId].order) : null;
          const nextOrder = nextId && libs[nextId] ? Number(libs[nextId].order) : null;
          let newOrder = computeOrderBetween(prevOrder, nextOrder);
          if (newOrder == null) {
            await reindexLibraries();
            await loadLibraries();
            container.__insertCandidate = null;
            Array.from(container.querySelectorAll('.library-card')).forEach(c => { c.classList.remove('insert-before'); c.classList.remove('insert-after'); });
            return;
          }
          await db.ref(`users/${currentUser.uid}/libs/${srcLib}/order`).set(newOrder);
          await loadLibraries();
        } catch (err) { console.error('Kitaplık sıralama hatası', err); }

    function renderBooks() {
      const booksList = document.getElementById('books-list');
      booksList.innerHTML = '';

      // Prepare entries and sort according to the selected sort option
      const entries = Object.entries(books || {});
      const sortEl = document.getElementById('sort-select');
      const sortType = sortEl ? sortEl.value : 'dateDesc';
      entries.sort(([, a], [, b]) => {
        if (sortType === 'dateDesc') return new Date(b.addDate || 0) - new Date(a.addDate || 0);
        if (sortType === 'dateAsc') return new Date(a.addDate || 0) - new Date(b.addDate || 0);
        if (sortType === 'alphaAsc') return (a.title || '').localeCompare(b.title || '');
        if (sortType === 'alphaDesc') return (b.title || '').localeCompare(a.title || '');
        if (sortType === 'pagesDesc') return (b.pagesRead || 0) - (a.pagesRead || 0);
        return 0;
      });

      entries.forEach(([key, book], index) => {
        const percent = book.totalPages ? Math.round((book.pagesRead / book.totalPages) * 100) : 0;
        const placeholder = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22225%22%3E%3Crect fill=%22%23667eea%22 width=%22150%22 height=%22225%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-size=%2220%22 fill=%22white%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22%3EKitap%3C/text%3E%3C/svg%3E';
        
        const card = document.createElement('div');
        card.className = `book-card ${compactView ? 'compact' : ''}`;
        card.style.animationDelay = `${index * 0.1}s`;
        // Resolve human-readable location names (rooms, libraries, shelves)
        const resolveRoom = (r) => {
          if (!r) return '-';
          // if r is an id in roomsMap
          if (roomsMap && roomsMap[r] && roomsMap[r].name) return roomsMap[r].name;
          // else try find by name
          for (const id of Object.keys(roomsMap || {})) { if (roomsMap[id] && roomsMap[id].name === r) return r; }
          return r || '-';
        };
        const resolveLib = (libVal) => {
          if (!libVal) return '-';
          if (libraries && libraries[libVal] && libraries[libVal].name) return libraries[libVal].name;
          // try find lib by name
          for (const id of Object.keys(libraries || {})) { if (libraries[id] && libraries[id].name === libVal) return libraries[id].name; }
          return libVal || '-';
        };
        const resolveShelf = (libVal, shelfVal) => {
          if (!shelfVal) return '-';
          // if libVal is an id and shelfVal is an id under it
          if (libraries && libraries[libVal] && libraries[libVal].shelves && libraries[libVal].shelves[shelfVal] && libraries[libVal].shelves[shelfVal].name) return libraries[libVal].shelves[shelfVal].name;
          // if shelfVal is a name, return it
          if (typeof shelfVal === 'string') return shelfVal;
          return shelfVal || '-';
        };

        const roomLabel = resolveRoom(book.room);
        const libLabel = resolveLib(book.bookshelf);
        const shelfLabel = resolveShelf(book.bookshelf, book.shelf);

        card.innerHTML = `
          <img src="${book.cover || placeholder}" alt="cover" class="book-cover" onerror="this.src='${placeholder}'" />
          <div class="book-info">
            <h3 class="book-title">${book.title}</h3>
            <p class="book-meta">${book.author || 'Yazar Bilinmiyor'}</p>
            <div class="book-progress">
              <div class="book-progress-bar" style="width: ${percent}%"></div>
            </div>
            <div class="book-stats">${book.pagesRead}/${book.totalPages} sayfa (${percent}%)</div>
            <div class="book-location">📍 ${roomLabel} / ${libLabel} / ${shelfLabel}</div>
            <div class="book-actions">
              <button class="btn btn-primary" onclick="editBook('${key}')">Düzenle</button>
              <button class="btn btn-danger" onclick="deleteBook('${key}')">Sil</button>
            </div>
          </div>
        `;
        // make draggable so user can move books between shelves
        card.draggable = true;
        card.dataset.key = key;
            card.addEventListener('dragstart', (ev) => {
              try {
                startDrag(); window.__currentDrag = { type: 'book', id: key };
                ev.dataTransfer.setData('text/plain', 'book:'+key);
                ev.dataTransfer.effectAllowed = 'move';
              } catch (e) {}
              try { console.log('[dragstart][card]', { key, title: book.title, bookshelf: book.bookshelf || null, shelf: book.shelf || null }); } catch (e) {}
            });
            card.addEventListener('dragend', () => { window.__currentDrag = null; endDrag(); });
        booksList.appendChild(card);
        setTimeout(() => card.classList.add('animate'), 50);

      setIf('f-room', book.room || '');
      setIf('f-cover', book.cover || '');
      setIf('f-note', book.note || '');

      // Resolve bookshelf/shelf: if stored value is an ID, look up names
      try {
        const libsSnap = await db.ref(`users/${currentUser.uid}/libs`).once('value');
        const libs = libsSnap.val() || {};
        let shelfName = '';
        let libName = '';
        if (book.bookshelf && libs[book.bookshelf]) {
          libName = libs[book.bookshelf].name || '';
          // find shelf name if shelf is id
          if (book.shelf && libs[book.bookshelf].shelves && libs[book.bookshelf].shelves[book.shelf]) {
            shelfName = libs[book.bookshelf].shelves[book.shelf].name || '';
          } else if (typeof book.shelf === 'string') {
            shelfName = book.shelf;
          }
        } else {
          // maybe books stored names instead of ids
          libName = book.bookshelf || '';
          shelfName = book.shelf || '';
        }
        setIf('f-bookshelf', libName);
        setIf('f-shelf', shelfName);
      } catch (err) {
        // fallback to raw values
        setIf('f-bookshelf', book.bookshelf || '');
        setIf('f-shelf', book.shelf || '');
      }

      document.getElementById('add-modal').classList.add('active');

          <img src="${book.cover || placeholder}" alt="cover" onerror="this.src='${placeholder}'" />
          <div class="search-result-info">
            <div class="search-result-title">${book.title}</div>
            <div class="search-result-meta">${book.author || 'Yazar Bilinmiyor'}</div>
            <div class="search-result-meta">${book.publisher || ''}</div>
          </div>
        `;
        div.addEventListener('click', () => {
          focusOnBook(book.key);
          searchResults.classList.remove('show');
          document.getElementById('search-input').value = '';
        });
        searchResults.appendChild(div);
      });
      
      searchResults.classList.add('show');
    }
    
    function focusOnBook(key) {
      const booksList = document.getElementById('books-list');
      const bookCards = booksList.querySelectorAll('.book-card');
      bookCards.forEach(card => {
        if (card.querySelector('.book-actions button').getAttribute('onclick') === `editBook('${key}')`) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.style.boxShadow = '0 0 10px var(--primary)';
          setTimeout(() => card.style.boxShadow = '', 2000);
        }
      });
    }
    async function searchGoogleBooks(query) {
      if (!query.trim()) return;
      
      const searchResults = document.getElementById('search-results');

      searchResults.innerHTML = '<div style="padding: 20px; text-align: center;" class="loading"><i class="fas fa-spinner spinner"></i> Aranıyor...</div>';
      searchResults.classList.add('show');

      try {
        const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=10`);
        const data = await response.json();

        searchResults.innerHTML = '';
          if (!data.items || data.items.length === 0) {
          // Show helpful UI: allow creating a new book from the query
          searchResults.innerHTML = `
            <div style="padding: 20px; text-align: center; color: var(--text-muted);">
              Kitap bulunamadı
              <div style="margin-top:12px">
                <button id="create-from-search" class="btn btn-success">Yeni Kitap Oluştur</button>
              </div>
            </div>
          `;
          const createBtn = document.getElementById('create-from-search');
          if (createBtn) createBtn.addEventListener('click', () => {
            // open add modal with search pane and prefill
            try { openAddModal(query || '', true); searchResults.classList.remove('show'); } catch (e) { console.error(e); }
          });
          return;
        }

        data.items.forEach(item => {
          const info = item.volumeInfo || {};
          const div = document.createElement('div');
          div.className = 'search-result-item';
          const placeholder = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2260%22%3E%3Crect fill=%22%23ccc%22 width=%2240%22 height=%2260%22/%3E%3C/svg%3E';
          
          div.innerHTML = `
            <img src="${info.imageLinks?.thumbnail || placeholder}" alt="cover" onerror="this.src='${placeholder}'" />
            <div class="search-result-info">
              <div class="search-result-title">${info.title || 'Bilinmiyor'}</div>
              <div class="search-result-meta">${(info.authors || ['Yazar Bilinmiyor']).join(', ')}</div>
              <div class="search-result-meta">${info.publisher || ''} ${info.publishedDate || ''}</div>
            </div>
          `;

          div.addEventListener('click', () => {
            // fill form elements by id (keeps predictable ordering for user)
            const setIf = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
            setIf('f-title', info.title || '');
            setIf('f-author', (info.authors || []).join(', '));
            setIf('f-publisher', info.publisher || '');
            setIf('f-publishedDate', info.publishedDate || '');
            setIf('f-totalPages', info.pageCount || '');
            setIf('f-cover', info.imageLinks?.thumbnail || '');

            searchResults.classList.remove('show');
            document.getElementById('search-input').value = '';
            document.getElementById('add-modal').classList.add('active');
          });

          searchResults.appendChild(div);
        });
      } catch (err) {
        console.error('Arama hatası:', err);
        searchResults.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--danger);">Arama başarısız oldu</div>';
      }
    }

    // Show chooser overlay to select an existing book to add to a library/shelf
    function showAddChooser(libId, shelfId, libName = '', shelfName = '') {
      // remove existing chooser if any
      const existing = document.getElementById('add-chooser-overlay');
      if (existing) existing.remove();

      const overlay = document.createElement('div');
      overlay.id = 'add-chooser-overlay';
      overlay.className = 'add-chooser-overlay';
      overlay.innerHTML = `
        <div class="add-chooser">
          <h3>Kitap Ekle</h3>
          <div class="list" id="chooser-list"></div>
          <div class="actions">
            <button class="btn btn-secondary" id="chooser-cancel">İptal</button>
            <button class="btn btn-primary" id="chooser-new">Yeni Kitap Oluştur</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      const list = document.getElementById('chooser-list');
      // list existing books (skip ones already in same lib/shelf optionally)
      const placeholder = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2260%22%3E%3Crect fill=%22%23153e75%22 width=%2240%22 height=%2260%22/%3E%3C/svg%3E';
      Object.entries(books || {}).forEach(([key, b]) => {
        const alreadyHere = (b.bookshelf === libId) && (shelfId ? b.shelf === shelfId : true);
        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = `
          <img src="${b.cover || placeholder}" onerror="this.src='${placeholder}'" />
          <div class="meta">
            <div style="font-weight:600">${b.title || 'Bilinmiyor'}</div>
            <div style="font-size:13px;opacity:0.9">${b.author || ''}</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            ${alreadyHere ? '<span style="font-size:13px;color:rgba(255,255,255,0.85);margin-right:8px">Zaten burada</span>' : `<button class="btn btn-primary" data-key="${key}">Ekle</button>`}
          </div>
        `;
        // when Ekle clicked, update book to target lib/shelf
        const addBtn = item.querySelector('button');
        if (addBtn) {
          addBtn.addEventListener('click', async () => {
            try {
              await db.ref(`users/${currentUser.uid}/books/${key}`).update({ bookshelf: libId || '', shelf: shelfId || '' });
              overlay.remove();
              await loadBooks();
              await loadLibraries();
            } catch (err) { alert('Hata: ' + err.message); }
          });
        }
        list.appendChild(item);
      });

      document.getElementById('chooser-cancel').addEventListener('click', () => overlay.remove());
      document.getElementById('chooser-new').addEventListener('click', () => {
        // open add modal prefilled with provided lib/shelf names
        if (document.getElementById('f-bookshelf')) document.getElementById('f-bookshelf').value = libName || '';
        if (document.getElementById('f-shelf')) document.getElementById('f-shelf').value = shelfName || '';
        editingKey = null;
        overlay.remove();
        const mf = document.getElementById('add-modal'); if (mf) mf.classList.add('active');
      });
      // add icons inside chooser
      applyButtonIcons(overlay);
    }
  </script>
